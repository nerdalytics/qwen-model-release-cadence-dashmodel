name: Publish dashboard and social preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Install image renderer
        run: python -m pip install CairoSVG==2.7.1 Pillow==11.3.0
      - name: Generate previews from current release data
        run: python scripts/generate-social-preview.py
      - name: Generate icons and SEO metadata
        run: python scripts/generate-site-assets.py
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html *.css *.js SOURCE_AUDIT.md README.md LICENSE _site/
          cp -r data assets _site/
          cp favicon.svg favicon.ico favicon-*.png apple-touch-icon.png icon-*.png site.webmanifest _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
